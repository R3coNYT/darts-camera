<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DartsCamera</title>
  <link rel="stylesheet" href="/static/css/style.css"/>
</head>
<body>

<!-- ════════════════════════════════════════════════════════════════
     SETUP MODAL
════════════════════════════════════════════════════════════════ -->
<div id="modal-setup" class="modal-overlay active">
  <div class="modal-box">
    <h1 class="modal-title">🎯 DartsCamera</h1>

    <div class="section-label">Mode de jeu</div>
    <div class="mode-grid">
      <button class="mode-btn active" data-mode="501">501</button>
      <button class="mode-btn" data-mode="301">301</button>
      <button class="mode-btn" data-mode="cricket">Cricket</button>
      <button class="mode-btn" data-mode="around_the_clock">Around the Clock</button>
      <button class="mode-btn" data-mode="free">Libre</button>
    </div>

    <div id="x01-options" class="x01-options">
      <label class="toggle-label">
        <input type="checkbox" id="opt-double-out" checked/>
        Double-out (finir sur un double)
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="opt-double-in"/>
        Double-in (commencer sur un double)
      </label>
    </div>

    <div class="section-label">Joueurs</div>
    <div id="player-list" class="player-list"></div>
    <div class="modal-row">
      <button id="btn-add-player" class="btn-ghost">+ Ajouter un joueur</button>
    </div>

    <button id="btn-start-game" class="btn-primary btn-large">Commencer la partie</button>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════════
     MAIN APP
════════════════════════════════════════════════════════════════ -->
<div id="app" class="hidden">

  <!-- Header ─────────────────────────────────────────────────── -->
  <header class="app-header">
    <div class="header-left">
      <span class="logo">🎯 DartsCamera</span>
      <span id="hdr-mode" class="badge badge-mode">501</span>
      <span id="hdr-round" class="badge badge-round">Round 1</span>
    </div>
    <div class="header-right">
      <span id="cam-indicator" class="cam-dot offline" title="Caméra"></span>
      <button id="btn-new-game" class="btn-ghost btn-sm">Nouvelle partie</button>
    </div>
  </header>

  <!-- 3-column grid ──────────────────────────────────────────── -->
  <div class="game-layout">

    <!-- ── LEFT: Scoreboard + History ──────────────────────────── -->
    <aside class="scoreboard-panel" id="scoreboard-panel">
      <div id="scoreboard-x01"     class="scoreboard-x01"></div>
      <div id="scoreboard-cricket" class="scoreboard-cricket hidden"></div>
      <div id="scoreboard-atc"     class="scoreboard-atc hidden"></div>

      <!-- Round history -->
      <div id="scoreboard-history" class="scoreboard-history">
        <div class="hist-title">HISTORIQUE</div>
        <div id="hist-rows"></div>
      </div>
    </aside>

    <!-- ── CENTER: Camera / Board + Throws bar ──────────────────── -->
    <section class="board-section">

      <!-- Tab bar: Camera (default) / Board -->
      <div class="tab-bar">
        <button class="tab active" data-tab="camera">📷 Caméra</button>
        <button class="tab"        data-tab="board" >🎯 Cible</button>
      </div>

      <!-- Camera tab (default active) -->
      <div id="tab-camera" class="tab-content active">
        <div class="camera-wrapper" id="cam-wrap">
          <img id="camera-feed" src="" alt="" class="camera-img hidden"/>
          <canvas id="cam-overlay" class="cam-overlay"></canvas>
          <div id="no-camera-msg" class="no-camera">
            📷 Caméra non disponible<br/>
            <small>Vérifiez la connexion et config.yaml</small>
          </div>
          <!-- Flash ring on detection -->
          <div id="detect-flash" class="detect-flash"></div>
        </div>
        <div class="camera-controls">
          <button id="btn-set-bg"       class="btn-ghost btn-sm">📸 Fond</button>
          <button id="btn-calibrate"    class="btn-ghost btn-sm">🔵 Calibrer</button>
          <button id="btn-detect"       class="btn-ghost btn-sm">⚡ Détecter</button>
          <button id="btn-auto-detect"  class="btn-ghost btn-sm btn-auto" data-active="false">
            <span class="auto-dot"></span> AUTO
          </button>
          <span id="cal-status-text" class="cal-status-text"></span>
        </div>
      </div>

      <!-- Board tab -->
      <div id="tab-board" class="tab-content">
        <div class="canvas-wrapper">
          <canvas id="board-canvas"></canvas>
          <img id="cam-pip" src="" alt="" class="cam-pip hidden"/>
          <div id="click-hint" class="click-hint">Cliquez sur la cible pour enregistrer un lancer</div>
        </div>
      </div>

      <!-- Throws bar ────────────────────────────────────────── -->
      <div class="throws-bar">
        <div class="throw-slot" id="slot-1">
          <div class="ts-label">–</div>
          <div class="ts-pts"></div>
        </div>
        <div class="throw-slot" id="slot-2">
          <div class="ts-label">–</div>
          <div class="ts-pts"></div>
        </div>
        <div class="throw-slot" id="slot-3">
          <div class="ts-label">–</div>
          <div class="ts-pts"></div>
        </div>
        <div class="throw-sum">
          <div id="throw-total-val" class="throw-total-num">0 pts</div>
          <div id="throw-bust-label" class="throw-bust-badge hidden">BUST!</div>
        </div>
      </div>

    </section>

    <!-- ── RIGHT: Player card + Detection state + Manual entry ── -->
    <aside class="info-panel">

      <!-- Current player card (big score) -->
      <div class="current-player-card" id="current-player-card">
        <div class="cp-turn-label">▶ AU TOUR DE</div>
        <div class="cp-name"     id="cp-name">—</div>
        <div class="cp-score"    id="cp-score">501</div>
        <div class="cp-checkout" id="cp-checkout"></div>
        <div class="cp-stats"    id="cp-stats"></div>
      </div>

      <!-- Auto-detection state indicator -->
      <div id="detect-state" class="detect-state">
        <span class="ds-pulse"></span>
        <span id="ds-label">Prêt</span>
      </div>

      <!-- Manual score entry -->
      <div class="manual-entry-section">
        <div class="section-label">Saisie manuelle</div>

        <div class="multiplier-row">
          <button class="mult-btn active" data-mult="1">Simple</button>
          <button class="mult-btn"        data-mult="2">Double</button>
          <button class="mult-btn"        data-mult="3">Triple</button>
        </div>

        <div class="number-grid" id="number-grid"></div>

        <div class="special-btns">
          <button class="spec-btn"      data-label="B"    data-score="25">Bull (25)</button>
          <button class="spec-btn"      data-label="DB"   data-score="50">Bullseye (50)</button>
          <button class="spec-btn miss" data-label="MISS" data-score="0" >Raté</button>
        </div>
      </div>

      <!-- Actions -->
      <div class="action-row">
        <button id="btn-undo"     class="btn-ghost">↩ Annuler</button>
        <button id="btn-end-turn" class="btn-primary">Valider le tour →</button>
      </div>

    </aside>
  </div><!-- .game-layout -->

  <!-- Winner overlay ─────────────────────────────────────────── -->
  <div id="winner-overlay" class="winner-overlay hidden">
    <div class="winner-box">
      <div class="winner-trophy">🏆</div>
      <div class="winner-title">VICTOIRE !</div>
      <div class="winner-name" id="winner-name">Joueur 1</div>
      <button id="btn-play-again" class="btn-primary btn-large">Rejouer</button>
    </div>
  </div>

</div><!-- #app -->

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"
        crossorigin="anonymous"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
